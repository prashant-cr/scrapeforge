[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapesmith"
version = "0.1.0"
description = "Schema-driven web scraping with layered anti-bot evasion and LLM-based extraction."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Prashant Suthar" }]
keywords = [
    "scraping",
    "web-scraping",
    "crawler",
    "http",
    "playwright",
    "pydantic",
    "llm",
    "structured-extraction",
    "anti-bot",
    "tls-fingerprint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    # brotli/zstd are not optional in practice: real browsers advertise them in
    # Accept-Encoding, so we must be able to decode what we ask for. Without the
    # decoders httpx hands back raw compressed bytes.
    "httpx[http2,brotli,zstd]>=0.28",
    "curl_cffi>=0.7",
    "pydantic>=2.6",
    "selectolax>=0.3.21",
    "tenacity>=8.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
tls = ["tls-client>=1.0.1"]
llm = ["instructor>=1.5", "anthropic>=0.40", "openai>=1.40"]
all = [
    "playwright>=1.44",
    "tls-client>=1.0.1",
    "instructor>=1.5",
    "anthropic>=0.40",
    "openai>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/prashant-cr/scrapekit"
Source = "https://github.com/prashant-cr/scrapekit"
Issues = "https://github.com/prashant-cr/scrapekit/issues"
Changelog = "https://github.com/prashant-cr/scrapekit/releases"

[tool.hatch.build.targets.wheel]
packages = ["scrapesmith"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "network: reaches a third-party host. Deselect with -m 'not network' for a hermetic run.",
]
filterwarnings = ["error::DeprecationWarning:scrapesmith.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is documentation, not source. Keep the formatter out of CLAUDE.md/README.md.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# User-agent strings are single tokens; wrapping them hurts readability more than
# it helps, and a mangled UA is a real bug.
"scrapesmith/fingerprint/user_agents.py" = ["E501"]
